<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00c0f4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00c0f4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle with safe padding for maskable Android -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer Sonarr Radar Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="16 16"/>
  
  <!-- Sonarr Wave Arcs -->
  <path d="M 170 340 A 120 120 0 0 1 342 340" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 200 310 A 80 80 0 0 1 312 310" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 230 280 A 40 40 0 0 1 282 280" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Center Core Orb -->
  <circle cx="256" cy="230" r="22" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="8" fill="#ffffff"/>
</svg>
