name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npx expo prebuild -p android --no-install
      # Signing secrets are scoped to this one step: the keystore is decoded, used, and deleted here.
      - name: Build signed APK and AAB
        working-directory: android
        env:
          RFS_KEYSTORE_BASE64: ${{ secrets.RFS_KEYSTORE_BASE64 }}
          RFS_KEYSTORE_PATH: ${{ runner.temp }}/rfs.jks
          RFS_KEYSTORE_PASSWORD: ${{ secrets.RFS_KEYSTORE_PASSWORD }}
          RFS_KEY_ALIAS: ${{ secrets.RFS_KEY_ALIAS }}
          RFS_KEY_PASSWORD: ${{ secrets.RFS_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$RFS_KEYSTORE_PATH"' EXIT
          echo "$RFS_KEYSTORE_BASE64" | base64 -d > "$RFS_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: remote-for-sonarr-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "remote-for-sonarr-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "remote-for-sonarr-$GITHUB_REF_NAME.apk" --generate-notes
